name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web + API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pesa
          POSTGRES_PASSWORD: pesa
          POSTGRES_DB: pesa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pesa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for a CI-only database and server — not real secrets.
      DATABASE_URL: postgresql://pesa:pesa@localhost:5432/pesa
      DATABASE_URL_UNPOOLED: postgresql://pesa:pesa@localhost:5432/pesa
      AUTH_SECRET: ci-auth-secret-0123456789abcdef0123456789abcdef
      AUTH_URL: http://localhost:3000
      MOBILE_JWT_SECRET: ci-mobile-jwt-secret-0123456789abcdef0123456789
      CRON_SECRET: ci-cron-secret-0123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # `build` applies the migrations to the CI database first.
      - run: npm run build
      - name: API smoke test against the production build
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/privacy && break; sleep 2; done
          npm run smoke:mobile
      - name: Server log on failure
        if: failure()
        run: cat next.log || true

  mobile:
    name: Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pesa_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --page-width 100 --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
